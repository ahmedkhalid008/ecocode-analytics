[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocode-telemetry"
version = "0.1.0"
description = "Lightweight Code-Level Carbon Telemetry & Green FinOps SDK"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Khalid Ahmed Tepu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://ecocode-backend-si2i.onrender.com"
Documentation = "https://ecocode-backend-si2i.onrender.com/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecocode*"]
